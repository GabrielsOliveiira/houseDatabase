{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicione sua moto</title>
    <link rel="stylesheet" href="{% static 'moto/css/addMoto.css' %}">
</head>
<body>
    <main class="container">
        <h1 id="titulo">Cadastrar moto</h1>

        <form action="" method="post" id="addMotoForm">
            {% csrf_token %}
            {{ form.as_p }}
            
            <button type="submit" id="addMoto">Adicionar</button>
        </form>

        <a href="{% url 'usuario:home' %}" id="voltar">← Voltar</a>
    </main>
</body>
</html>
