{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Histórico</title>

    <link rel="stylesheet" href="{% static 'moto/css/history.css' %}">
</head>

<body>

<div class="container">

    <div class="page-header">
        <h1>Histórico</h1>

        <a href="{% url 'moto:index' moto_id %}" class="back-link">
            ← Voltar
        </a>
    </div>

    <form action="" class="order-form">
        <label for="order">Ordenar por:</label>

        <select name="order" id="order">
            {% for value, label in orders %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>

        <button type="submit">Ordenar</button>
    </form>

    <div class="history-list">

        {% for info in data %}

            <div class="history-card">

                <div class="history-info">
                    <p>{{ info }}</p>
                </div>

                <div class="actions">

                    <button class="update" type="button" data-id="{{ info.id }}">
                        Atualizar
                    </button>

                    <form method="post"
                          action="{% url 'moto:delete' type=type id=info.id %}">
                        {% csrf_token %}

                        <button type="submit" class="delete">
                            Excluir
                        </button>
                    </form>

                </div>

            </div>

        {% empty %}

            <div class="empty">
                <p>Nenhum registro encontrado.</p>
            </div>

        {% endfor %}

    </div>

    <div id="divUpdate" class="update-container" style="display: none;">

        <form action="" method="post" data-type="{{ type }}" id="formUpdate">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="button" class="save" id="btnSave">
                Salvar alterações
            </button>
        </form>

    </div>

</div>

<script src="{% static 'moto/js/history.js' %}"></script>

</body>
